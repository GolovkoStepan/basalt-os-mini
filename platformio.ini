; Две платы в одном репозитории, пока идёт переезд. Обе - ESP32-S3, поэтому
; код arch/xtensa у них общий; различаются только пины и способ сигналить.
; ---------------------------------------------------------------------------
; ПРОЕКТ (основное): LilyGO T-Display-S3 - ESP32-S3R8, 16 МБ flash, 8 МБ PSRAM.
; env:tdisplay       - своя ОС: баннер, тик, подсветка экрана как индикатор.
; env:tdisplay-panic - то же, но через 5 секунд намеренно падает.
; env:probe          - щуп: чип, flash, PSRAM, помещается ли кадровый буфер.
;
; УХОДИТ (Cardputer, переезжает в проект capsh): M5Stack Cardputer K132,
; ESP32-S3FN8, 8 МБ flash, PSRAM нет. Держится здесь, пока переезд не
; закончен: A0 на этой плате проверен на живом железе, ломать проверенную
; сборку ради новой платы незачем.
; env:bare    - та же своя ОС на Cardputer, индикатор - WS2812.
; env:console - минимальная прошивка на Arduino: баннер, тик, клавиатура,
;               подсветка экрана.
; env:bringup - щуп: ST7789 по голым регистрам, замеры SPI 40/60/80 МГц.
;               Экспериментальный, запускать на живой плате осознанно.
;
; БЕЗ ПЛАТЫ:
; env:native  - тесты на маке: pio test -e native
; ---------------------------------------------------------------------------

[platformio]
; default_envs - основная плата проекта, T-Display-S3. `pio run` без аргументов
; собирает именно её: случайно залить не тот env хуже, чем набрать -e.
default_envs = tdisplay

; Общие настройки прошивок.
;
; Отдельная секция, а не [env]: секция [env] достаётся всем env'ам без
; исключения, включая [env:native], где компилятор системный и доска ESP32 ему
; только мешает - "Board is not defined". Поэтому общее подключается явно,
; через extends.
[base]
platform = espressif32@8.0.0        ; Arduino core 3.3.12 / IDF 5.5.5
board = esp32-s3-devkitc-1          ; M5StampS3 = голый S3 + 8 MB flash
framework = arduino
monitor_speed = 115200
upload_speed = 1500000              ; USB Serial/JTAG держит высокую скорость
board_build.flash_size = 8MB
board_upload.flash_size = 8MB

; Консоль - USB Serial/JTAG, а не UART0: моста UART->USB на обеих платах нет.
; ARDUINO_USB_MODE=1 переключает Serial на аппаратный CDC (HWCDC).
; CORE_DEBUG_LEVEL не задаём: Arduino core определяет его сам, повторный -D
; даёт warning на каждом файле.
;
; BOARD_HAS_PSRAM здесь НЕ ставится: у Cardputer (env:bare, console, bringup)
; PSRAM физически нет, и такая прошивка упала бы. У T-Display-S3 её включает
; board-файл платы (memory_type: qio_opi), правки флагов не нужно.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Пины платы лежат в boards/<плата>/board_pins.h, и путь к ним подставляется
; сборкой. Так один и тот же код собирается под разные платы без #ifdef и без
; общей свалкой констант: у каждой платы свой файл, и он один.
;
; build_flags в env ниже перечислены целиком, а не «дополнительно к базе»:
; extends не склеивает списки, а заменяет их. Поэтому ${base.build_flags} стоит
; явно - иначе пропадут -D USB и сборка соберётся, но консоли не будет.

[env:console]
extends = base
build_src_filter = +<console/>
build_flags =
    ${base.build_flags}
    -Iboards/cardputer

[env:hello]
extends = base
build_src_filter = +<hello/>
build_flags =
    ${base.build_flags}
    -Iboards/cardputer

; A0: без Arduino. Свои консоль и тик по регистрам, старт IDF пока штатный.
; arch/xtensa подключается отдельным путём: это не логика приложения, а слой
; платформы, и жить он должен отдельно от src/.
;
; env:bare - M5Stack Cardputer. Остаётся в репозитории, пока идёт переезд:
; A0 на этой плате проверен на живом железе, и ломать проверенную сборку ради
; новой платы незачем.
[env:bare]
extends = base
framework = espidf
build_src_filter = +<bare/>
; Карта памяти своя: см. ld/memory.ld. IDF при этом продолжает подставлять свой
; sections.ld - там каталог секций компонентов, которые мы всё ещё используем.
board_build.ldscript = ld/memory.ld
build_flags =
    -Iarch/xtensa/include

; Та же A0, но на LilyGO T-Display-S3 - плате, на которую проект переезжает.
;
; Что меняется относительно env:bare: идентификатор платы, размер flash (16 МБ
; вместо 8) и выбор платы для сборки. Код тот же: своя точка входа, консоль,
; тик, паника, векторы и карта памяти живут на уровне чипа, а чип тот же S3.
;
; Выбор платы идёт через board_build.cmake_extra_args, а не через -D в
; build_flags: src/CMakeLists.txt должен собрать РАЗНЫЕ наборы файлов (у плат
; разные индикаторы), а список источников решается на этапе CMake.
[env:tdisplay]
extends = env:bare
board = lilygo-t-display-s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DBASALT_BOARD_TDISPLAY=1

[env:tdisplay-panic]
extends = env:tdisplay
build_flags =
    ${env:tdisplay.build_flags}
    -DBASALT_PANIC_TEST

; Щуп перед A1: чип, flash, PSRAM, помещается ли кадровый буфер 108.8 КБ.
;
; Тот же старт, консоль, тик и индикатор, что у env:tdisplay, но другой main.c -
; выбор приложения идёт через CMake-переменную (см. src/CMakeLists.txt). Отдельный
; env, а не флаг в командной строке: проверку «PSRAM есть» надо повторять на
; каждой новой плате и после каждой смены sdkconfig, иначе её просто не вспомнят.
;
; Признак успеха: в логе строки [probe] с размерами и вывод «полный кадр в PSRAM
; помещается». Записывать цифры - в docs/board.md, §10.
[env:probe]
extends = env:tdisplay
board_build.cmake_extra_args =
    -DBASALT_BOARD_TDISPLAY=1
    -DBASALT_APP_PROBE=1

; Первая проверка экрана: инициализация панели и заливка полосами.
;
; Отдельный env, пока драйвер не доказан: env:tdisplay - проверенная сборка A0,
; и ломать её ради новой периферии незачем. Когда текст на экране заработает,
; этот main.c станет основным, а env - нет.
;
; Признак успеха: на экране восемь цветных полос и белый квадрат в левом
; верхнем углу, в логе - время полного кадра. Числа и выводы - в docs/board.md,
; §10, пункт 7.
[env:lcd]
extends = env:tdisplay
board_build.cmake_extra_args =
    -DBASALT_BOARD_TDISPLAY=1
    -DBASALT_APP_LCD=1

; Текстовый режим: сетка 53x17 на живом экране.
;
; Отдельный env по той же причине, что env:lcd: env:tdisplay - проверенная A0.
; Признак успеха описан в src/text/main.c и в docs/ROADMAP.md, веха A1.
[env:text]
extends = env:tdisplay
board_build.cmake_extra_args =
    -DBASALT_BOARD_TDISPLAY=1
    -DBASALT_APP_TEXT=1

[env:bringup]
extends = base
build_src_filter = +<bringup/>
build_flags =
    ${base.build_flags}
    -Iboards/cardputer

; A0: та же прошивка, но через 5 секунд намеренно падает.
; Отдельный env, а не флаг в командной строке: проверка паники не должна
; требовать помнить аргументы, иначе её не повторят.
[env:bare-panic]
extends = env:bare
build_flags =
    ${env:bare.build_flags}
    -DBASALT_PANIC_TEST

; Тесты на хосте: переносимая логика, плата не нужна.
;
; Собирается не весь проект, а только файлы без обращений к регистрам:
; board/framework здесь не заданы намеренно, компилятор - системный.
; Путь с ../ нужен потому, что build_src_filter считается от src/, а тестируемый
; файл живёт в слое платформы (arch/xtensa) - логика в нём при этом переносимая.
[env:native]
platform = native
test_framework = unity
; Версия зафиксирована числом, а не «^2.6.1»: иначе обновление библиотеки
; ломает сборку без единой правки в нашем коде.
lib_deps = throwtheswitch/Unity@2.6.1
; По умолчанию тестовая сборка берёт только test/, без src/. Нам нужны ровно
; эти файлы из дерева, поэтому включаем сборку src/ и фильтруем её списком.
;
; Список явный, а не «всё, что не тянет регистры»: как только в него попадёт
; файл с soc/..., сборка тестов упадёт на системном компиляторе, и разбираться
; придётся не с тестом, а с фильтром. Шрифт в списке потому, что через него
; проверяется поиск глифа: код кириллицы должен находиться, а мусор - нет.
test_build_src = yes
build_src_filter =
    +<../arch/xtensa/format.c>
    +<../text/matrix.c>
    +<../text/utf8.c>
    +<../text/font_5x7.c>
build_flags =
    -Iarch/xtensa/include
    -Itext
    -std=gnu11
    -Wall
    -Wextra
